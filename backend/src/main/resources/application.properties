spring.application.name=robot-repair
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/repair}
spring.datasource.username=${DB_USER:repair}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=repair-results-v2
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.listener.ack-mode=record
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.error.include-message=never
app.files=${FILE_ROOT:./data/files}
app.internal-token=${INTERNAL_SERVICE_TOKEN}
app.cors-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.mcp-url=${MCP_URL:http://localhost:8089/mcp}
app.mcp-token=${MCP_TOKEN:}
app.commands-topic=diagnosis.commands.v2
app.events-topic=diagnosis.events.v2

# Temporary, uncalibrated photo policy; see docs/PHOTO_QUALITY.md.
app.photo-quality.enabled=${PHOTO_QUALITY_ENABLED:true}
app.photo-quality.policy-version=pilot-v1
app.photo-quality.min-width=640
app.photo-quality.min-height=480
app.photo-quality.max-width=10000
app.photo-quality.max-height=10000
app.photo-quality.max-decode-pixels=25000000
app.photo-quality.inspection-max-size=1024
app.photo-quality.dark-pixel-threshold=40
app.photo-quality.bright-pixel-threshold=245
app.photo-quality.dark-ratio-warning=0.60
app.photo-quality.bright-ratio-warning=0.40
app.photo-quality.sharpness-warning=100
app.photo-quality.workers=2
app.photo-quality.queue-capacity=8
app.photo-quality.max-attempts=3
app.photo-quality.lease-seconds=120
