plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.skala'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
 implementation 'org.webjars:swagger-ui:5.32.1'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
 implementation 'org.springframework.boot:spring-boot-starter-security'
 implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
 implementation 'org.springframework.boot:spring-boot-starter-jdbc'
 implementation 'org.springframework.boot:spring-boot-starter-flyway'
 implementation 'org.springframework.boot:spring-boot-starter-kafka'
 implementation 'org.flywaydb:flyway-database-postgresql'
 implementation 'org.postgresql:postgresql'
 testImplementation 'org.springframework.boot:spring-boot-starter-test'
 testImplementation 'org.springframework.security:spring-security-test'
 testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.3'
 testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.3'
 testImplementation 'org.testcontainers:testcontainers-kafka:2.0.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Package the reviewed contract in both bootRun and the executable JAR.
tasks.named('processResources') {
    from('docs/openapi.json') { into 'api-docs' }
}
